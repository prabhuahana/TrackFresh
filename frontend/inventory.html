<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FreshTrack Inventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--
PSEUDOCODE:
BEGIN
  render form for adding food items
  gather name, purchase date, expiry date, quantity, unit, and category
  when Add Item is clicked:
    validate required fields
    save item to inventory
    update food list and reminders
END
-->
<div class="layout">
<aside>
  <h1>FreshTrack</h1>
  <nav>
    <a href="dashboard.html"><img src="../HomePage.png" alt="">Home</a>
    <a href="reminders.html"><img src="../ExpiryDates.png" alt="">Reminders</a>
    <a href="inventory.html"><img src="../Inventory.png" alt="">Inventory</a>
    <a href="recipes.html"><img src="../Recipes.png" alt="">Recipes</a>
    <a href="shopping.html"><img src="../Shopping.png" alt="">Shopping</a>
    <a href="help.html"><img src="../FoodFacts.png" alt="">Food Facts</a>
  </nav>
  <div class="sidebar-footer">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Dark mode</button>
  </div>
</aside>
<main>
<div class="topbar">
  <a class="brand" href="dashboard.html" aria-label="FreshTrack home"><span>Track</span><strong>Fresh</strong><i></i></a>
  <a class="profile-link" href="profile.html" aria-label="Open profile"><img src="../profile.png" alt=""></a>
</div>
<header>
  <h2>Inventory</h2>
  <p>Add and manage the food currently in your kitchen.</p>
</header>

<section>
  <h3>Add Food</h3>
  <input id="foodName" placeholder="Food name">
  <input id="purchaseDate" type="date" title="Purchase date">
  <input id="expiryDate" type="date">
  <div class="quantity-row">
    <input id="quantity" type="number" placeholder="Amount">
    <select id="unit">
      <option value="g">grams (g)</option>
      <option value="kg">kilograms (kg)</option>
      <option value="ml">millilitres (mL)</option>
      <option value="L">litres (L)</option>
      <option value="pieces">pieces</option>
    </select>
  </div>
  <select id="foodCategory">
    <option value="produce">Produce</option>
    <option value="dairy">Dairy</option>
    <option value="meat">Meat</option>
    <option value="grains">Grains</option>
    <option value="pantry">Pantry</option>
    <option value="frozen">Frozen</option>
    <option value="beverages">Beverages</option>
    <option value="other">Other</option>
  </select>
  <div class="checkbox-row">
    <input type="checkbox" id="favouriteCheck">
    <label for="favouriteCheck">Weekly staple (auto-add to shopping list)</label>
  </div>
  <button onclick="addFood()">Add Item</button>
</section>

<section>
  <h3>Your Food</h3>
  <div id="foodList"><p class="empty-state">No items added yet.</p></div>
</section>

</main>
</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
