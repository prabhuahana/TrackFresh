<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FreshTrack — Favourites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--
====================================================================
PSEUDOCODE (EXAM STYLE) - FAVORITES PAGE
====================================================================
DISPLAY "Your Saved Recipes" header

CALL loadFavorites() function to get saved recipe names
FOR each favourited recipe DO
    DISPLAY recipe card with name, image, and description
ENDFOR

IF no favourites saved THEN
    DISPLAY "No favourites yet"
ENDIF
====================================================================
-->
<button class="theme-toggle theme-toggle-float" onclick="toggleTheme()" aria-label="Toggle dark mode">Dark mode</button>

<div class="layout">
<aside>
  <h1>FreshTrack</h1>
  <nav>
    <a href="dashboard.html"><img src="Button_HomePage_Dark.png" alt="" class="nav-img-dark"><img src="Button_HomePage_Light.png" alt="" class="nav-img-light">Home</a>
    <a href="reminders.html"><img src="Button_ExpiryDates_Dark.png" alt="" class="nav-img-dark"><img src="Button_ExpiryDates_Light.png" alt="" class="nav-img-light">Reminders</a>
    <a href="inventory.html"><img src="Button_Fridge_Dark.png" alt="" class="nav-img-dark"><img src="Button_Fridge_Light.png" alt="" class="nav-img-light">Fridge</a>
    <a href="recipes.html"><img src="Button_Recipes_Dark.png" alt="" class="nav-img-dark"><img src="Button_Recipes_Light.png" alt="" class="nav-img-light">Recipes</a>
    <a href="shopping.html"><img src="Button_ShoppingLists_Dark.png" alt="" class="nav-img-dark"><img src="Button_ShoppingLists_Light.png" alt="" class="nav-img-light">Shopping</a>
    <!-- Favs accessed only via recipes.html topbar -->
    <a href="help.html"><img src="Button_FoodFacts_Dark.png" alt="" class="nav-img-dark"><img src="Button_FoodFacts_Light.png" alt="" class="nav-img-light">Food Facts</a>
  </nav>
  <div class="sidebar-footer">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Dark mode</button>
  </div>
</aside>

<main>
  <div class="topbar">
    <a class="brand" href="dashboard.html" aria-label="FreshTrack home">
      <img src="Logo_Light.png" alt="TrackFresh" class="brand-logo brand-logo-light">
      <img src="Logo_Dark.png" alt="TrackFresh" class="brand-logo brand-logo-dark">
    </a>
    <div class="topbar-actions">
      <a class="profile-link" href="profile.html" aria-label="Open profile">
        <img src="Icon_Profile_Dark.png" alt="" class="nav-img-dark">
        <img src="Icon_Profile_Light.png" alt="" class="nav-img-light">
      </a>
    </div>
  </div>

  <header>
    <a href="recipes.html" class="back-link">&#8592; Back to Recipes</a>
    <h2>Favourites</h2>
    <p>Your saved recipes — click the heart to remove.</p>
  </header>

  <section>
    <div id="favoritesList"></div>
  </section>
</main>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
  if (document.getElementById("favoritesList")) { loadFavorites(); }
</script>
</body>
</html>
