<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FreshTrack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<button class="theme-toggle theme-toggle-float" onclick="toggleTheme()" aria-label="Toggle dark mode">Dark mode</button>
<!--

================================================================================
PSEUDOCODE (EXAM STYLE) - DASHBOARD PAGE
================================================================================
DISPLAY "FreshTrack Dashboard"
CALL applyTheme() function
CALL getFoods() function to fetch inventory
FOR each food item DO
    IF expiry date within 3 days THEN
        DISPLAY in "Expiry" section with warning badge
    ENDIF
ENDFOR
FOR each food item DO
    DISPLAY in "Fridge" carousel
ENDFOR
DISPLAY quick action tiles
IF user clicks a tile THEN
    REDIRECT to corresponding page
ENDIF
================================================================================

-->

<div class="layout">
<aside>
  <h1>FreshTrack</h1>
  <nav>
    <a href="dashboard.html" class="nav-icon-home active"><img src="Button_HomePage_Dark.png" alt="" class="nav-img-dark"><img src="Button_HomePage_Light.png" alt="" class="nav-img-light">Home</a>
    <a href="reminders.html" class="nav-icon-reminders"><img src="Button_ExpiryDates_Dark.png" alt="" class="nav-img-dark"><img src="Button_ExpiryDates_Light.png" alt="" class="nav-img-light">Reminders</a>
    <a href="inventory.html" class="nav-icon-inventory"><img src="Button_Fridge_Dark.png" alt="" class="nav-img-dark"><img src="Button_Fridge_Light.png" alt="" class="nav-img-light">Fridge</a>
    <a href="recipes.html" class="nav-icon-recipes"><img src="Button_Recipes_Dark.png" alt="" class="nav-img-dark"><img src="Button_Recipes_Light.png" alt="" class="nav-img-light">Recipes</a>
    <a href="shopping.html" class="nav-icon-shopping"><img src="Button_ShoppingLists_Dark.png" alt="" class="nav-img-dark"><img src="Button_ShoppingLists_Light.png" alt="" class="nav-img-light">Shopping</a>
    <a href="help.html" class="nav-icon-foodfacts"><img src="Button_FoodFacts_Dark.png" alt="" class="nav-img-dark"><img src="Button_FoodFacts_Light.png" alt="" class="nav-img-light">Food Facts</a>
  </nav>
  <div class="sidebar-footer">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Dark mode</button>
  </div>
</aside>
<main class="dash-main">
  <header class="dash-header">
    <a class="dash-logo" href="dashboard.html" aria-label="TrackFresh home">
      <img src="Logo_Light.png" alt="TrackFresh" class="brand-logo brand-logo-light">
      <img src="Logo_Dark.png" alt="TrackFresh" class="brand-logo brand-logo-dark">
    </a>
    <div class="user-menu-wrap">
      <button class="avatar-btn" onclick="toggleUserMenu(event)" aria-label="Open user menu">
        <img src="Icon_Profile_Dark.png" alt="" class="nav-img-dark">
        <img src="Icon_Profile_Light.png" alt="" class="nav-img-light">
      </button>
      <div class="user-menu" id="userMenu">
        <a href="profile.html">Profile</a>
        <a href="profile.html">Settings</a>
        <a href="help.html">Help</a>
        <a href="#" class="menu-logout" onclick="logoutUser(); return false;">Log Out</a>
      </div>
    </div>
  </header>

  <section class="dash-card">
    <div class="dash-section-head">
      <h2>Expiry</h2>
      <a class="see-more" href="reminders.html">See more <span>›</span></a>
    </div>
    <div id="expiryList" class="expiry-rows"><p class="empty-state">Loading…</p></div>
  </section>

  <section class="dash-section dash-fridge">
    <div class="dash-section-head">
      <h2>Fridge</h2>
      <a class="see-more" href="inventory.html">See more <span>›</span></a>
    </div>
    <div id="fridgeCarousel" class="fridge-carousel"></div>
  </section>

  <section class="dash-section dash-quick">
    <div class="quick-grid">
      <a class="quick-card" href="recipes.html">
        <img src="Icon_Recipes_Dark.png" alt="" class="quick-icon quick-icon-dark">
        <img src="Icon_Recipes_Light.png" alt="" class="quick-icon quick-icon-light">
        <span class="quick-label">Recipes</span>
      </a>
      <a class="quick-card" href="shopping.html">
        <img src="Icon_ShoppingLists_Dark.png" alt="" class="quick-icon quick-icon-dark">
        <img src="Icon_ShoppingLists_Light.png" alt="" class="quick-icon quick-icon-light">
        <span class="quick-label">Shopping Lists</span>
      </a>
      <a class="quick-card" href="scan.html">
        <img src="Icon_RecipeScanning_Dark.png" alt="" class="quick-icon quick-icon-dark">
        <img src="Icon_RecipeScanning_Light.png" alt="" class="quick-icon quick-icon-light">
        <span class="quick-label">Receipt Scanning</span>
      </a>
      <a class="quick-card" href="help.html">
        <img src="Icon_FoodFacts_Dark.png" alt="" class="quick-icon quick-icon-dark">
        <img src="Icon_FoodFacts_Light.png" alt="" class="quick-icon quick-icon-light">
        <span class="quick-label">Fun Facts</span>
      </a>
    </div>
  </section>
</main>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
