<!DOCTYPE html>
<html>
<head>
  <title>FreshTrack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
</head>
<body>


<!--

================================================================================
PSEUDOCODE - LOGIN PAGE
================================================================================
DISPLAY "FreshTrack - Your kitchen, organised."
DISPLAY "Enter your email:"
INPUT email
DISPLAY "Enter your password:"
INPUT password
DISPLAY "Click Sign In button"
IF user clicks Sign In THEN
    CALL login() function
    IF credentials valid THEN
        REDIRECT to dashboard.html
    ELSE
        DISPLAY "Invalid email or password"
    ENDIF
ENDIF
DISPLAY "Don't have an account? Create one"
IF user clicks "Create one" THEN
    REDIRECT to signup.html
ENDIF
================================================================================

-->

<div class="login-page">
  <div class="login-card">
    <h1>TrackFresh</h1>
    <p class="tagline">Your kitchen, organised.</p>
    <h2>Sign in</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button onclick="login()">Sign In</button>
    <p class="account-text">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
