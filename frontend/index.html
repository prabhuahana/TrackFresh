<!DOCTYPE html>
<html>
<head>
  <title>FreshTrack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!--
PSEUDOCODE:
BEGIN
  display login page with email and password input
  when user clicks Sign In:
    validate credentials
    redirect to dashboard if valid
  show link to create account page
END
-->

<div class="login-page">
  <div class="login-card">
    <h1>FreshTrack</h1>
    <p class="tagline">Your kitchen, organised.</p>
    <h2>Sign in</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button onclick="login()">Sign In</button>
    <p class="account-text">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
