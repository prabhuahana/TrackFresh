<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FreshTrack — Shopping List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--
====================================================================
PSEUDOCODE (EXAM STYLE) - SHOPPING LIST PAGE
====================================================================
FOR each shopping list DO
    DISPLAY list card with header

    FOR each item in list DO
        DISPLAY item with checkbox
        IF user clicks delete THEN
            REMOVE item from list
        ENDIF
    ENDFOR

    IF user presses Enter OR clicks "+" THEN
        INPUT newItem
        CALL addItemToList() function
    ENDIF
ENDFOR
====================================================================
-->
<button class="theme-toggle theme-toggle-float" onclick="toggleTheme()" aria-label="Toggle dark mode">Dark mode</button>
<div class="layout">
<aside>
  <h1>FreshTrack</h1>
  <nav>
    <a href="dashboard.html" class="nav-icon-home"><img src="Button_HomePage_Dark.png" alt="" class="nav-img-dark"><img src="Button_HomePage_Light.png" alt="" class="nav-img-light">Home</a>
    <a href="reminders.html" class="nav-icon-reminders"><img src="Button_ExpiryDates_Dark.png" alt="" class="nav-img-dark"><img src="Button_ExpiryDates_Light.png" alt="" class="nav-img-light">Reminders</a>
    <a href="inventory.html" class="nav-icon-inventory"><img src="Button_Fridge_Dark.png" alt="" class="nav-img-dark"><img src="Button_Fridge_Light.png" alt="" class="nav-img-light">Fridge</a>
    <a href="recipes.html" class="nav-icon-recipes"><img src="Button_Recipes_Dark.png" alt="" class="nav-img-dark"><img src="Button_Recipes_Light.png" alt="" class="nav-img-light">Recipes</a>
    <a href="shopping.html" class="nav-icon-shopping"><img src="Button_ShoppingLists_Dark.png" alt="" class="nav-img-dark"><img src="Button_ShoppingLists_Light.png" alt="" class="nav-img-light">Shopping</a>
    <a href="help.html" class="nav-icon-foodfacts"><img src="Button_FoodFacts_Dark.png" alt="" class="nav-img-dark"><img src="Button_FoodFacts_Light.png" alt="" class="nav-img-light">Food Facts</a>
  </nav>
  <div class="sidebar-footer">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Dark mode</button>
  </div>
</aside>

<main>
<div class="topbar">
  <a class="brand" href="dashboard.html" aria-label="FreshTrack home">
    <img src="Logo_Light.png" alt="TrackFresh" class="brand-logo brand-logo-light">
    <img src="Logo_Dark.png" alt="TrackFresh" class="brand-logo brand-logo-dark">
  </a>
  <div class="topbar-actions">
    <div class="user-menu-wrap">
      <button class="avatar-btn" onclick="toggleUserMenu(event)" aria-label="Open user menu">
        <img src="Icon_Profile_Dark.png" alt="" class="nav-img-dark">
        <img src="Icon_Profile_Light.png" alt="" class="nav-img-light">
      </button>
      <div class="user-menu" id="userMenu">
        <a href="profile.html">Profile</a>
        <a href="#" class="menu-logout" onclick="logoutUser(); return false;">Log Out</a>
      </div>
    </div>
  </div>
</div>

<header>
  <h2>Shopping List</h2>
  <p>Organize your shopping across multiple lists.</p>
</header>

<div class="shopping-lists-container">
  <section class="shopping-list-card">
    <div class="card-header">
      <h3>AI List</h3>
      <button class="btn-small btn-outline" onclick="clearList('aiList')">Clear</button>
    </div>
    <div class="shopping-items" id="aiList"></div>
    <div class="add-item-row">
      <input type="text" id="aiListInput" placeholder="Add item...">
      <button class="btn-small" onclick="addItemToList('aiList')">+</button>
    </div>
  </section>

  <section class="shopping-list-card">
    <div class="card-header">
      <h3>Custom List</h3>
      <button class="btn-small btn-outline" onclick="clearList('customList')">Clear</button>
    </div>
    <div class="shopping-items" id="customList"></div>
    <div class="add-item-row">
      <input type="text" id="customListInput" placeholder="Add item...">
      <button class="btn-small" onclick="addItemToList('customList')">+</button>
    </div>
  </section>

  <section class="shopping-list-card">
    <div class="card-header">
      <h3>Other List</h3>
      <button class="btn-small btn-outline" onclick="clearList('otherList1')">Clear</button>
    </div>
    <div class="shopping-items" id="otherList1"></div>
    <div class="add-item-row">
      <input type="text" id="otherList1Input" placeholder="Add item...">
      <button class="btn-small" onclick="addItemToList('otherList1')">+</button>
    </div>
  </section>

  <section class="shopping-list-card">
    <div class="card-header">
      <h3>Other List</h3>
      <button class="btn-small btn-outline" onclick="clearList('otherList2')">Clear</button>
    </div>
    <div class="shopping-items" id="otherList2"></div>
    <div class="add-item-row">
      <input type="text" id="otherList2Input" placeholder="Add item...">
      <button class="btn-small" onclick="addItemToList('otherList2')">+</button>
    </div>
  </section>
</div>

</main>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
