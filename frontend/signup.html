<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Create Account — TrackFresh</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body>


<!--

================================================================================
PSEUDOCODE (EXAM STYLE) - SIGNUP PAGE
================================================================================
DISPLAY "FreshTrack - Start reducing food waste today."
DISPLAY "Enter your name:"
INPUT name
DISPLAY "Enter your email:"
INPUT email
DISPLAY "Enter your password:"
INPUT password
DISPLAY "Confirm your password:"
INPUT confirmPassword
DISPLAY "Click Create Account button"
IF user clicks Create Account THEN
    CALL strvalidation(name) with rules
    CALL emailvalidation(email) with rules
    CALL strvalidation(password) with rules
    IF name = "" THEN
        DISPLAY "Name cannot be blank"
    ELSEIF email = "" THEN
        DISPLAY "Email cannot be blank"
    ELSEIF password = "" THEN
        DISPLAY "Password cannot be blank"
    ELSEIF password != confirmPassword THEN
        DISPLAY "Passwords do not match"
    ELSE
        CALL signup() function
        REDIRECT to dashboard.html
    ENDIF
ENDIF
================================================================================

-->

<div class="login-page">
  <div class="login-card">
    <h1>TrackFresh</h1>
    <p class="tagline">Start reducing food waste today!</p>
    <h2>Create account</h2>
    <input type="text" placeholder="Name">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm Password">
    <button onclick="signup()">Create Account</button>
    <p class="account-text">
      Already have an account?
      <a href="index.html">Sign in</a>
    </p>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
