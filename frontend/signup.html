<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Create Account — FreshTrack</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body>
<button class="theme-toggle theme-toggle-float theme-toggle-float-top" onclick="toggleTheme()" aria-label="Toggle dark mode">Dark mode</button>

<!--
PSEUDOCODE:
BEGIN
  display signup page with name, email, password, and confirm password fields
  when user clicks Create Account:
    check all fields are filled
    ensure passwords match
    save profile data
    redirect to profile or dashboard
END
-->

<div class="login-page">
  <div class="login-card">
    <h1>FreshTrack</h1>
    <p class="tagline">Start reducing food waste today.</p>
    <h2>Create account</h2>
    <input type="text" placeholder="Name">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm Password">
    <button onclick="signup()">Create Account</button>
    <p class="account-text">
      Already have an account?
      <a href="index.html">Sign in</a>
    </p>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
